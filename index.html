
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo de Medicamentos</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <main>

    <h1>Catalogo de Medicamentos</h1>

    <!-- Importacion temporal de laboratorios -->
    <button id="btnImportar">
      Agregar laboratorios
    </button>

    <section class="formulario">
      <input type="text" id="inputNombre"
        placeholder="Nombre del medicamento">

      <input type="number" id="inputPrecio"
        placeholder="Precio" min="0">

      <select id="selectLaboratorio"></select>

      <button id="btnGuardar">Guardar</button>
    </section>

    <div id="mensaje"></div>

    <section>
      <input type="text" id="inputBuscar"
        class="buscador"
        placeholder="Buscar medicamento">

      <div class="acciones">
        <button id="btnMostrar">Mostrar medicamentos </button>
        <button id="btnLimpiar">Borrar</button>
      </div>
    </section>

    <section>
      <h2>Resultados</h2>

      <ul id="listaMedicamentos"></ul>

      <p class="total">
        Total: <span id="contador">0</span>
      </p>
    </section>

  </main>

  <script src="catalogo.js"></script>
  <script src="importar-laboratorios.js"></script>

</body>
</html>
