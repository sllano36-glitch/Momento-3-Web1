<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmacia - Catalogo de medicamentos</title>
  <link rel="stylesheet" href="catalogo.css">
</head>
<body>
  <main>
    <h1>Catalogo de medicamentos</h1>
    <p class="subtitulo">Agrega medicamentos y buscalos sin recargar la pagina.</p>

    
    <section>
      <h2>Nuevo medicamento</h2>
      <div class="fila">
        <div>
          <label for="inputNombre">Nombre</label>
          <input type="text" id="inputNombre" placeholder="Ej: Loratadina 10mg">
        </div>
        <div>
          <label for="inputPrecio">Precio (COP)</label>
          <input type="number" id="inputPrecio" min="0" placeholder="Ej: 4500">
        </div>
        <div>
          <label for="selectLaboratorio">Laboratorio</label>
          <select id="selectLaboratorio"></select>
        </div>
      </div>
      <button id="btnGuardar">Guardar medicamento</button>
      <p id="mensaje" role="status"></p>
    </section>

   
    <section>
      <h2>Medicamentos</h2>
      <div class="fila">
        <div>
          <label for="inputBuscar">Buscar por nombre</label>
          <input type="text" id="inputBuscar" placeholder="Escribe para filtrar...">
        </div>
      </div>
      <button id="btnMostrar">Mostrar todos</button>
      <button id="btnLimpiar" class="secundario">Limpiar lista</button>
      <p>Resultados: <span id="contador">0</span></p>
      <ul id="listaMedicamentos"></ul>
    </section>
  </main>

  <script src="catalogo.js"></script>
</body>
</html>
